name: Job alerts

on:
  schedule:
    - cron: "17 * * * *"   # hourly at minute 17 (UTC); GitHub may delay runs a few minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print digest, no email, no state saved)"
        type: boolean
        default: false
      max_score:
        description: "Max new jobs to score this run (default 30; use e.g. 400 once to clear a backlog)"
        type: string
        default: "30"

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "anthropic>=0.60" "pypdf>=4.0" "python-docx>=1.1"

      # Already-emailed job IDs persist between runs in the Actions cache (private to workflows).
      - name: Restore seen jobs
        uses: actions/cache/restore@v4
        with:
          path: .seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      # Running total of Claude spend (separate cache so the seen-jobs cache above stays as it was).
      - name: Restore spend ledger
        uses: actions/cache/restore@v4
        with:
          path: .spend.json
          key: spend-${{ github.run_id }}
          restore-keys: spend-

      - name: Decode resume from secret
        env:
          RESUME_B64: ${{ secrets.RESUME_B64 }}
        run: |
          test -n "$RESUME_B64" || { echo "Set the RESUME_B64 secret (base64 of your resume PDF or text)"; exit 1; }
          echo "$RESUME_B64" | base64 -d > resume.bin
          # Secrets max out at 48 KB, so a text resume is allowed too; detect which one we got.
          if head -c 4 resume.bin | grep -q '%PDF'; then mv resume.bin resume.pdf; else mv resume.bin resume.txt; fi
          echo "RESUME_PATH=$(ls resume.pdf resume.txt 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Run watcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          MIN_FIT: ${{ vars.MIN_FIT }}
          BUDGET_USD: ${{ vars.BUDGET_USD }}
          MAX_SCORE: ${{ inputs.max_score }}
          LOW_BALANCE_USD: ${{ vars.LOW_BALANCE_USD }}
        run: python job_watcher.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save seen jobs
        if: success() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: .seen_jobs.json
          key: seen-jobs-${{ github.run_id }}

      - name: Save spend ledger
        if: success() && hashFiles('.spend.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .spend.json
          key: spend-${{ github.run_id }}

      - name: Remove resume
        if: always()
        run: rm -f resume.pdf resume.txt resume.bin
